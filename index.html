<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="自己人">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>自己人</title>
<style>
 :root{
   --bg1:#12100d; --bg2:#0a0807; --bg3:#070605;
   --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.075);
   --line:rgba(255,255,255,.09); --text:#f2ece4; --muted:#a3948a; --dim:#6d6058;
   --accent:#e8a45c; --accent2:#c9793a; --amber:#e8a45c; --red:#e08b7a;
 }
 body[data-theme="light"]{
   --bg1:#f7f3ec; --bg2:#efe9df; --bg3:#e9e2d6;
   --surface:rgba(0,0,0,.035); --surface2:rgba(0,0,0,.06);
   --line:rgba(0,0,0,.09); --text:#241f1a; --muted:#6d6259; --dim:#8a7f75;
   --accent:#b4703a; --accent2:#8c5227; --amber:#a8642c; --red:#b8503f;
 }
 body[data-theme="forest"]{
   --bg1:#0c1712; --bg2:#080f0b; --bg3:#060b08;
   --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.075);
   --line:rgba(255,255,255,.08); --text:#e8f2ec; --muted:#8aa398; --dim:#5f746b;
   --accent:#7ad1a5; --accent2:#3f9b73; --amber:#d9b46a; --red:#d98b7a;
 }
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{height:100%}
 body{
   background:
     radial-gradient(120% 55% at 50% -10%, var(--bg1) 0%, transparent 58%),
     radial-gradient(90% 45% at 100% 0%, var(--bg1) 0%, transparent 62%),
     linear-gradient(180deg, var(--bg2) 0%, var(--bg3) 100%);
   background-attachment:fixed;
   color:var(--text); font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
   min-height:100vh; max-width:560px; margin:0 auto;
   padding:calc(20px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));
   -webkit-font-smoothing:antialiased; letter-spacing:.01em;
 }
 .kicker{color:var(--dim);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
 h1{font-size:28px;font-weight:700;margin:10px 0 8px;line-height:1.35;letter-spacing:-.01em}
 .sub{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:22px}
 .card{
   background:linear-gradient(180deg,var(--surface),rgba(255,255,255,.015));
   border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:14px;
   box-shadow:0 10px 30px rgba(0,0,0,.25);
   transition:transform .18s ease, border-color .18s ease;
 }
 .card:active{transform:scale(.995)}
 .task{font-size:19px;font-weight:650;line-height:1.45}
 .meta{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.65}
 .tiny{color:var(--amber);font-size:13px;margin-top:7px}
 .row{display:flex;gap:10px;margin-top:16px}
 button{
   border:none;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;
   font-family:inherit;cursor:pointer;transition:transform .12s ease,opacity .15s ease;
 }
 .primary{
   background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1108;flex:1;
   box-shadow:0 6px 20px rgba(200,120,60,.22);
 }
 .ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
 button:active{transform:scale(.97)}
 button:disabled{opacity:.45}
 .done{opacity:.42}
 .done .task{text-decoration:line-through;color:var(--muted)}
 .empty{color:var(--dim);text-align:center;padding:40px 0;line-height:1.9;font-size:14px}
 input,textarea{
   width:100%;background:var(--surface);border:1px solid var(--line);
   border-radius:14px;color:var(--text);padding:13px 14px;font-size:16px;
   font-family:inherit;margin-top:10px;transition:border-color .15s ease;
 }
 input:focus,textarea:focus{outline:none;border-color:var(--accent)}
 nav{
   position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;
   padding:10px 12px calc(12px + env(safe-area-inset-bottom));
   background:color-mix(in srgb, var(--bg3) 82%, transparent);
   backdrop-filter:blur(22px);border-top:1px solid var(--line);
 }
 nav a{
   color:var(--dim);text-decoration:none;font-size:12.5px;padding:9px 15px;border-radius:12px;
   transition:all .18s ease;font-weight:500;
 }
 nav a.on{color:#1a1108;background:linear-gradient(180deg,var(--accent),var(--accent2));font-weight:700}
 .msg{display:flex;margin-bottom:10px}
 .msg.user{justify-content:flex-end}
 .bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.65}
 .msg.user .bubble{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1108;border-bottom-right-radius:5px}
 .msg.assistant .bubble{background:var(--surface2);border-bottom-left-radius:5px}
 .stage{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
 .stage:last-child{border:none}
 .top{display:flex;justify-content:space-between;align-items:center}
 .gear{color:var(--dim);font-size:22px;cursor:pointer;
   width:44px;height:44px;display:flex;align-items:center;justify-content:center;
   border-radius:12px;margin:-8px -8px -8px 0;user-select:none}
 .gear:active{background:var(--surface2)}
 .hero{display:flex;align-items:center;gap:18px;margin:6px 0 20px}
 .ring{position:relative;width:74px;height:74px;flex:0 0 auto}
 .ring svg{transform:rotate(-90deg)}
 .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
   font-size:16px;font-weight:700;color:var(--accent)}
 .hero .h-text{flex:1}
 .hero h1{margin:0 0 6px}
 .bar{height:6px;background:var(--surface2);border-radius:3px;margin-top:12px;overflow:hidden}
 .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));
   transition:width .55s cubic-bezier(.22,.61,.36,1)}
 .badge{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:6px}
 .fixed-card{border-color:color-mix(in srgb, var(--accent) 22%, transparent)}
 .fixed-card.meal{border-color:color-mix(in srgb, var(--amber) 22%, transparent)}
 </style>
</head>
<body>
<div id="view"></div>
<nav>
 <a href="#today" id="n-today">今天</a>
 <a href="#goals" id="n-goals">目标</a>
 <a href="#review" id="n-review">复盘</a>
 <a href="#new" id="n-new">＋</a>
</nav>
<script>
/* ================= 配置与数据层 ================= */
const LS = 'coach_cfg_v1';
let CFG = JSON.parse(localStorage.getItem(LS) || '{}');
let D = null, TAB = (location.hash || '#today').slice(1);

const saveCfg = () => localStorage.setItem(LS, JSON.stringify(CFG));

const esc = s => (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const todayStr = () => new Date().toLocaleDateString('sv-SE');   // yyyy-mm-dd

async function gh(method, body) {
  const r = await fetch(`https://api.github.com/gists/${CFG.gist}`, {
    method: method || 'GET',
    headers: { Authorization: 'Bearer ' + CFG.token, Accept: 'application/vnd.github+json',
               'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.json();
}

async function loadData() {
  const g = await gh();
  const f = Object.values(g.files)[0];
  D = JSON.parse(f.content || '{}');
  D.goals = D.goals || []; D.log = D.log || {};
  D.fixed = D.fixed || {};
  D.fixed.water = D.fixed.water || { goal_ml: 1700, cup_ml: 200, ml: 0, date: todayStr() };
  if (D.fixed.water.date !== todayStr()) { D.fixed.water.date = todayStr(); D.fixed.water.ml = 0; }
  if (!D.fixed.meals) {
    const old = D.fixed.meal || {};
    D.fixed.meals = [
      { key: 'lunch',  label: '午饭', time: '11:30', date: old.date || '' },
      { key: 'dinner', label: '晚饭', time: '17:30', date: '' }
    ];
  }
  D.reviews = D.reviews || [];
  // 清理 7 天前的照片缩略图（gist 不能无限增长）
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  const cut = cutoff.toLocaleDateString('sv-SE');
  Object.keys(D.log || {}).forEach(k => {
    if (k < cut) Object.keys(D.log[k]).forEach(kk => { if (kk.startsWith('p')) delete D.log[k][kk]; });
  });
  return D;
}

async function saveData() {
  const content = JSON.stringify(D, null, 1);
  const files = {}; files[CFG.file || 'gistfile1.txt'] = { content };
  await gh('PATCH', { files });
}

/* ================= AI ================= */
const SYS_PLAN = `你是严格的个人教练，把目标拆成可执行计划。
只输出 JSON：{"why":"一句话","stages":[{"period":"阶段 1","focus":"8字内","daily":"每天的具体动作(含时长)","tiny":"2分钟内能做完的最小版本"}]}
规则：3-5个阶段；daily 必须是动作不是目标；tiny 必须是 daily 的极简版；不要鸡汤。`;

const SYS_CHAT = `你是用户的私人教练。回答要短（50字内），每次给一个能立刻执行的动作。

你必须真正执行用户的指令，而不是只嘴上答应：
- 用户说「太难/太忙/时间不够/没动力」→ 必须输出 update_plan 降低难度
- 用户说「加量/提高/想多练」→ 必须输出 update_plan 提高难度
- 用户说「改成 X」「换成 Y」「不要 Z」→ 必须输出 update_plan 照做
- 用户只是提问、诉说、不需要改计划 → update_plan 为 null

输出 JSON：
{"reply":"...","update_plan":null}
或
{"reply":"...","update_plan":{"why":"一句话说明现在练什么","stages":[{"period":"阶段 1","focus":"...","daily":"...","tiny":"..."}]}}

改计划时：
1. 保留 3-5 个阶段骨架
2. daily 必须同步改（首页显示的就是 daily，不改就会出现"目标页变了、今天页没变"）
3. why 用一句话说清当前的核心逻辑`;

async function aiVision(promptText, dataUrl) {
  const r = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + CFG.aiKey },
    body: JSON.stringify({
      model: CFG.model || 'deepseek-flash',
      messages: [{ role: 'user', content: [
        { type: 'text', text: promptText },
        { type: 'image_url', image_url: { url: dataUrl, detail: 'low' } }
      ]}]
    })
  });
  if (!r.ok) throw new Error('AI ' + r.status);
  const j = await r.json();
  const t = j.choices[0].message.content.trim()
    .replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
  return JSON.parse(t);
}

async function ai(sys, user) {
  const r = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + CFG.aiKey },
    body: JSON.stringify({
      model: CFG.model || 'deepseek-flash', temperature: 0.7,
      response_format: { type: 'json_object' },
      messages: [{ role: 'system', content: sys }, { role: 'user', content: user }]
    })
  });
  if (!r.ok) throw new Error('AI ' + r.status);
  const j = await r.json();
  let t = j.choices[0].message.content.trim()
    .replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
  return JSON.parse(t);
}

/* ================= 渲染 ================= */
function ensureSetup() {
  if (!CFG.gist || !CFG.token || !CFG.aiKey) {
    document.getElementById('view').innerHTML = `
      <div class="kicker">第一次使用</div>
      <h1>连接你的数据</h1>
      <div class="sub">填一次就好，存在这台手机的浏览器里，不会上传到任何地方。</div>
      <div class="card">
        <div class="meta">Gist ID</div>
        <input id="s-gist" placeholder="32693d30..." value="${esc(CFG.gist||'')}">
        <div class="meta" style="margin-top:12px">GitHub Token（gist 权限）</div>
        <input id="s-token" placeholder="ghp_..." value="${esc(CFG.token||'')}">
        <div class="meta" style="margin-top:12px">DeepSeek API Key</div>
        <input id="s-ai" placeholder="sk-..." value="${esc(CFG.aiKey||'')}">
        <div class="meta" style="margin-top:12px">文件名（gist 里的那个）</div>
        <input id="s-file" placeholder="gistfile1.txt" value="${esc(CFG.file||'gistfile1.txt')}">
        <div class="row"><button class="primary" onclick="doSetup()">连接</button></div>
        <div id="s-err" class="meta" style="color:#f0a84a"></div>
      </div>`;
    return false;
  }
  return true;
}

async function doSetup() {
  CFG = { gist: v('s-gist'), token: v('s-token'), aiKey: v('s-ai'), file: v('s-file') || 'gistfile1.txt' };
  try {
    await loadData(); saveCfg(); render();
  } catch (e) {
    document.getElementById('s-err').textContent = '连接失败：' + e.message;
  }
}
const v = id => document.getElementById(id).value.trim();

function items() {
  const log = (D.log || {})[todayStr()] || {};
  return D.goals.filter(g => !g.paused).map(g => {
    const st = g.stages[Math.min(g.stage || 0, g.stages.length - 1)];
    const tiny = (g.level || 2) <= 1;
    return { id: g.id, title: g.title, task: tiny ? st.tiny : st.daily, isTiny: tiny,
             state: log[g.id] || 'open', streak: g.streak || 0, stage: st.period,
             toNext: Math.max(0, 5 - (g.stage_streak || 0)),
             canUp: (g.stage || 0) < g.stages.length - 1,
             check: g.check };   // ← 之前漏了这个，导致时长永远是默认 15 分钟
  });
}

const CHECK_LABEL = { timer: '计时', photo: '拍照', count: '计数', abstain: '戒断', none: '直接打卡' };

function inferCheck(title) {
  const t = title || '';
  if (/戒|不抽|不刷|少喝|少吃|别/.test(t)) return { type: 'abstain' };
  if (/喝|水|杯/.test(t)) return { type: 'count', target: 8 };
  if (/练|读|学|弹|写|运动|跑|健身/.test(t)) return { type: 'timer', minutes: 15 };
  return { type: 'none' };
}

function checkOf(g) { return g.check || inferCheck(g.title); }

function checkUI(g, st) {
  const c = checkOf(g);
  const done = st.state === 'done';
  if (done) return `<div class="row"><button class="ghost" onclick="act(${g.id},'undo')">撤销</button></div>`;
  if (c.type === 'timer') {
    return `<div class="row">
      <button class="primary" onclick="startTimer(${g.id},${c.minutes || 15})">开始 ${c.minutes || 15} 分钟</button>
      <button class="ghost" onclick="act(${g.id},'done')">已经做了</button></div>`;
  }
  if (c.type === 'photo') {
    return `<div class="row">
      <button class="primary" onclick="shoot(${g.id})">拍张照</button>
      <button class="ghost" onclick="act(${g.id},'done')">跳过照片</button></div>
      <input id="cam-${g.id}" type="file" accept="image/*" capture="environment" style="display:none" onchange="shootDone(${g.id},this)">`;
  }
  if (c.type === 'count') {
    const n = (D.log[todayStr()] && D.log[todayStr()]['c' + g.id]) || 0;
    const tgt = c.target || 8;
    return `<div class="meta">今天 ${n} / ${tgt}</div>
      <div class="row"><button class="primary" onclick="countUp(${g.id},${tgt})">+1</button></div>`;
  }
  if (c.type === 'abstain') {
    return `<div class="row">
      <button class="primary" onclick="act(${g.id},'done')">今天忍住了</button>
      <button class="ghost" style="color:#f08a8a" onclick="act(${g.id},'undo')">今天破功了</button></div>`;
  }
  return `<div class="row"><button class="primary" onclick="act(${g.id},'done')">做了</button>
    <button class="ghost" onclick="act(${g.id},'later')">推迟</button></div>`;
}

let TIMERS = {};
function startTimer(id, mins) {
  const end = Date.now() + mins * 60000;
  TIMERS[id] = end;
  render();
  const tick = setInterval(() => {
    if (!TIMERS[id]) return clearInterval(tick);
    const left = Math.max(0, Math.round((TIMERS[id] - Date.now()) / 1000));
    const el = document.getElementById('tm-' + id);
    if (el) el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 0) { clearInterval(tick); act(id, 'done'); }
  }, 1000);
}
function cancelTimer(id) { delete TIMERS[id]; render(); }
function shoot(id) { document.getElementById('cam-' + id).click(); }

function shrink(file, max, quality) {
  return new Promise((res, rej) => {
    const img = new Image(); const fr = new FileReader();
    fr.onload = () => { img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', quality));
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function shootDone(id, input) {
  if (!input.files || !input.files[0]) return;
  const g = D.goals.find(x => x.id === id);
  const task = g ? g.title : '这件事';
  try {
    input.disabled = true;
    const big = await shrink(input.files[0], 512, 0.7);
    const custom = (checkOf(g).prompt || '').trim();
    const rule = custom
      ? '用户自己定的合格标准是：「' + custom + '」。严格按这个标准判断。'
      : '宽松判断：只要有相关物品或场景即可。';
    const out = await aiVision(
      '这张照片能否证明用户刚才在做「' + task + '」？' + rule +
      '只输出 JSON：{"ok":true/false,"comment":"20字以内，说清哪里不合格或哪里合格"}', big);
    if (!out.ok) { alert('AI 没认出来：' + (out.comment || '换一张试试')); input.disabled = false; input.value = ''; return; }
    const thumb = await shrink(input.files[0], 180, 0.6);
    const d = todayStr(); D.log[d] = D.log[d] || {};
    D.log[d]['p' + id] = { t: thumb, c: out.comment || '' , date: d };
    await act(id, 'done');
  } catch (e) {
    alert('识别失败：' + e.message);
    input.disabled = false;
  }
}
async function countUp(id, target) {
  const d = todayStr(); D.log[d] = D.log[d] || {};
  const k = 'c' + id;
  D.log[d][k] = (D.log[d][k] || 0) + 1;
  if (D.log[d][k] >= target) D.log[d][id] = 'done';
  await saveData(); await loadData(); render();
}

function fixedCards() {
  const w = D.fixed.water, m = D.fixed.meal;
  const left = Math.max(0, w.goal_ml - w.ml);
  const pct = Math.min(100, Math.round(w.ml / w.goal_ml * 100));
  return `
    <div class="card fixed-card">
      <div class="task">喝水 <span style="font-size:12px;color:#7f959d">固定</span></div>
      <div class="meta">已喝 ${w.ml} / ${w.goal_ml} ml　${left > 0 ? '还差 ' + left + ' ml' : '今天够了'}</div>
      <div style="height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:10px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
      <div class="row"><button class="primary" onclick="drink()">喝了一杯（+${w.cup_ml} ml）</button></div>
    </div>
    ${(D.fixed.meals || []).map(m => {
      const done = m.date === todayStr();
      return `<div class="card fixed-card meal">
        <div class="task">细嚼慢咽 · ${m.label} <span class="badge">${m.time}</span></div>
        <div class="meta">吃饭慢一点，这一口嚼二十下${done ? '　· 已完成' : ''}</div>
        <div class="row">${done
          ? `<button class="ghost" onclick="meal('${m.key}',false)">撤销</button>`
          : `<button class="primary" onclick="meal('${m.key}',true)">吃完了</button>`}</div>
      </div>`;
    }).join("")}`;
}

async function drink() {
  const w = D.fixed.water;
  if (w.date !== todayStr()) { w.date = todayStr(); w.ml = 0; }
  w.ml += w.cup_ml || 200;
  await saveData(); await loadData(); render();
}

async function meal(key, done) {
  const m = (D.fixed.meals || []).find(x => x.key === key);
  if (!m) return;
  m.date = done ? todayStr() : '';
  await saveData(); await loadData(); render();
}

function setTheme(t) { CFG.theme = t; saveCfg(); applyTheme(); render(); }

function applyTheme() {
  document.body.dataset.theme = CFG.theme || 'warm';
}

function render() {
  applyTheme();
  if (!ensureSetup()) return;
  ['today','goals','new'].forEach(t => {
    const el = document.getElementById('n-' + t); if (el) el.className = (t === TAB ? 'on' : '');
  });
  const V = document.getElementById('view');
  if (TAB === 'today') {
    const it = items(); const done = it.filter(i => i.state === 'done').length;
    let head, sub;
    if (!it.length) { head = '还没有目标'; sub = '先加一个，只加一个。'; }
    else if (!done) { head = '今天还没开始'; sub = '挑最小的那件，做两分钟。'; }
    else if (done < it.length) { head = `做了 ${done} 件，还剩 ${it.length - done}`; sub = '继续，或者今天就到这。'; }
    else { head = '今天的都做完了'; sub = '不需要再加码，休息是计划的一部分。'; }
    const w = D.fixed.water, left = Math.max(0, w.goal_ml - w.ml);
    const total = it.length + 2;
    const fin = done + (left <= 0 ? 1 : 0) + (D.fixed.meal.date === todayStr() ? 1 : 0);
    const pct = Math.round(fin / total * 100);
    const C = 2 * Math.PI * 31;
    V.innerHTML = `
      <div class="top"><div class="kicker">${todayStr()}</div><div class="gear" onclick="go('settings')">⚙</div></div>
      <div class="hero">
        <div class="ring">
          <svg width="74" height="74" viewBox="0 0 74 74">
            <circle cx="37" cy="37" r="31" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
            <circle cx="37" cy="37" r="31" fill="none" stroke="url(#g)" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - fin / total)}"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent2)"/>
            </linearGradient></defs>
          </svg>
          <div class="pct">${fin}/${total}</div>
        </div>
        <div class="h-text"><h1>${esc(head)}</h1><div class="sub" style="margin:0">${esc(sub)}</div></div>
      </div>
      ${fixedCards()}
      ${it.length ? it.map(i => `
        <div class="card ${i.state==='done'?'done':''}">
          <div class="task">${esc(i.title)}</div>
          <div class="meta">${esc(i.task)}</div>
          ${i.isTiny ? '<div class="tiny">今天是最小版本：做完就算赢</div>' : ''}
          <div class="meta">${esc(i.stage)} · 连续 ${i.streak} 天${i.canUp?` · 还差 ${i.toNext} 天进下一阶段`:' · 已到最后一阶段'}</div>
          ${(D.log[todayStr()] && D.log[todayStr()]['p' + i.id]) ? `<div style="margin-top:10px;display:flex;gap:10px;align-items:center">
            <img src="${D.log[todayStr()]['p' + i.id].t}" style="width:64px;height:64px;object-fit:cover;border-radius:10px">
            <div class="meta" style="margin:0">${esc(D.log[todayStr()]['p' + i.id].c || '')}</div></div>` : ''}
          ${TIMERS[i.id] ? `<div class="meta" id="tm-${i.id}" style="font-size:26px;color:var(--accent);margin-top:10px">--:--</div>
            <div class="row"><button class="ghost" onclick="cancelTimer(${i.id})">放弃计时</button></div>` : checkUI(i, i)}
        </div>`).join('') : '<div class="empty">还没有目标<br>点下面「＋ 新目标」</div>'}`;
  }
  if (TAB === 'goals') {
    V.innerHTML = `<div class="kicker">全部目标</div><h1>${D.goals.length} 个目标</h1>
      <div class="sub">同时别超过 3 个</div>` + D.goals.map(g => `
      <div class="card" style="${g.paused?'opacity:.55':''}">
        <div class="task">${esc(g.title)}${g.paused?' <span style="font-size:12px;color:#f0a84a">已暂停</span>':''}</div>
        <div class="meta">${esc(g.why || '')}</div>
        <div class="meta">${esc(g.stages[Math.min(g.stage||0,g.stages.length-1)].period)} · 连续 ${g.streak||0} 天 · 等级 ${g.level||2}</div>
        <div class="row" style="flex-wrap:wrap">
          <button class="primary" onclick="go('goal-${g.id}')">看计划</button>
          <button class="ghost" onclick="togglePause(${g.id})">${g.paused?'恢复':'暂停'}</button>
          <button class="ghost" style="color:#f08a8a;border-color:rgba(240,138,138,.35)" onclick="delGoal(${g.id})">删除</button>
        </div>
      </div>`).join('') + `
      <div class="card" style="opacity:.9">
        <div class="task">喝水 <span style="font-size:12px;color:#7f959d">固定 · 不可删除</span></div>
        <div class="meta">每天 ${D.fixed.water.goal_ml} ml，一杯 ${D.fixed.water.cup_ml} ml</div>
        <div class="row"><button class="ghost" disabled>系统内置</button></div>
      </div>
      <div class="card" style="opacity:.9">
        <div class="task">细嚼慢咽 <span style="font-size:12px;color:#7f959d">固定 · 不可删除</span></div>
        <div class="meta">每天 11:30 提醒</div>
        <div class="row"><button class="ghost" disabled>系统内置</button></div>
      </div>`;
  }
  if (TAB.startsWith('goal-')) {
    const id = +TAB.split('-')[1];
    const g = D.goals.find(x => x.id === id);
    if (!g) { V.innerHTML = '没找到'; return; }
    V.innerHTML = `
      <div class="kicker">${esc(g.type || 'goal')}</div>
      <h1>${esc(g.title)}</h1><div class="sub">${esc(g.why || '')}</div>
      <div class="card">${g.stages.map((s, i) => `<div class="stage">
        <span>${esc(s.period)} · ${esc(s.focus)}</span><b>${i === (g.stage||0) ? '← 现在' : '·'}</b></div>`).join('')}</div>
      <div class="card"><div class="meta">连续 ${g.streak||0} 天 · 等级 ${g.level||2}</div>
        <div class="meta" style="margin-top:8px">打卡方式：${CHECK_LABEL[checkOf(g).type]}</div>
        <div class="row" style="flex-wrap:wrap;gap:7px">
          ${Object.keys(CHECK_LABEL).map(k => `<button class="ghost" style="font-size:13px;padding:8px 11px;${checkOf(g).type===k?'border-color:var(--accent);color:var(--accent)':''}" onclick="setCheck(${g.id},'${k}')">${CHECK_LABEL[k]}</button>`).join('')}
        </div>
        ${checkOf(g).type === 'timer' ? `
          <div class="meta" style="margin-top:14px">时长：${checkOf(g).minutes || 15} 分钟</div>
          <div class="row" style="flex-wrap:wrap;gap:7px">
            ${[5,10,15,20,30,45,60].map(m => `<button class="ghost" style="font-size:13px;padding:8px 11px;${(checkOf(g).minutes||15)===m?'border-color:var(--accent);color:var(--accent)':''}" onclick="setMinutes(${g.id},${m})">${m}分</button>`).join('')}
            <button class="ghost" style="font-size:13px;padding:8px 11px" onclick="setMinutes(${g.id},0)">自定义</button>
          </div>` : ''}
        ${checkOf(g).type === 'photo' ? `
          <div class="meta" style="margin-top:14px">合格的拍照标准（AI 按这个判断）</div>
          <textarea id="pm-${g.id}" placeholder="比如：画面里要有吉他和我的手，能看到琴弦。只有吉他或只有手都不算。">${esc(checkOf(g).prompt || '')}</textarea>
          <div class="row"><button class="ghost" onclick="setPrompt(${g.id})">保存标准</button></div>` : ''}
        ${checkOf(g).type === 'count' ? `
          <div class="meta" style="margin-top:14px">今天的目标次数：${checkOf(g).target || 8}</div>
          <div class="row" style="flex-wrap:wrap;gap:7px">
            ${[4,6,8,10,12,20].map(n => `<button class="ghost" style="font-size:13px;padding:8px 11px;${(checkOf(g).target||8)===n?'border-color:var(--accent);color:var(--accent)':''}" onclick="setTarget(${g.id},${n})">${n} 次</button>`).join('')}
          </div>` : ''}
      </div>
      <div class="card">
        <div class="meta" style="margin-bottom:10px">和教练说</div>
        <div>${(g.chat||[]).map(m => `<div class="msg ${m.role}"><div class="bubble">${esc(m.text)}</div></div>`).join('') || '<div class="meta">还没有对话</div>'}</div>
        <div class="row" style="flex-wrap:wrap;gap:7px">
          ${['太忙了，只能练5分钟','太难了，做不到','没动力，不想做'].map(q =>
            `<button class="ghost" style="font-size:13px;padding:8px 11px" onclick="quick(${g.id},'${q}')">${q}</button>`).join('')}
        </div>
        <textarea id="chatmsg" placeholder="说说你现在的情况"></textarea>
        <div class="row"><button class="primary" onclick="sendChat(${g.id})">发送</button></div>
      </div>
      <div class="card">
        <div class="meta">不想要这个目标了？删除后不会恢复。</div>
        <div class="row"><button class="ghost" style="color:#f08a8a;border-color:rgba(240,138,138,.3)" onclick="delGoal(${g.id})">删除这个目标</button></div>
      </div>`;
  }
  if (TAB === 'settings') {
    const themes = [['warm','暖夜'],['light','米白'],['forest','墨绿']];
    V.innerHTML = `<div class="kicker">设置</div><h1>外观与数据</h1>
      <div class="sub">配色会记在这台设备上</div>
      <div class="card">
        <div class="meta">配色</div>
        <div class="row" style="flex-wrap:wrap;gap:8px">
          ${themes.map(([k, n]) => `<button class="ghost" style="${(CFG.theme||'warm')===k?'border-color:var(--accent);color:var(--accent);font-weight:700':''}" onclick="setTheme('${k}')">${n}</button>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="meta">这台设备上的配置（Gist / Token / AI Key）</div>
        <div class="row"><button class="ghost" style="color:var(--red)" onclick="logout()">清除配置</button></div>
      </div>`;
  }
  if (TAB === 'review') {
    const rs = (D.reviews || []).slice().reverse();
    const thisWeek = weekKey();
    const has = rs.some(r => r.week === thisWeek);
    V.innerHTML = `<div class="kicker">每周复盘</div><h1>看一周，不评价</h1>
      <div class="sub">AI 读你这周的打卡，指出模式，给一条建议。</div>
      <div class="card">
        <div class="row">${has
          ? '<button class="ghost" onclick="genReview(true)">重新生成这周的</button>'
          : '<button class="primary" onclick="genReview(false)">生成本周复盘</button>'}</div>
        <div id="rv-err" class="meta" style="color:#f0a84a"></div>
      </div>
      ${rs.map(r => `<div class="card">
        <div class="kicker">${esc(r.week)}</div>
        <div style="font-size:16px;line-height:1.9;margin-top:10px;white-space:pre-wrap">${esc(r.text)}</div>
      </div>`).join('') || '<div class="empty">还没有复盘</div>'}`;
  }
  if (TAB === 'new') {
    V.innerHTML = `<div class="kicker">新建目标</div><h1>你想改变什么</h1>
      <div class="sub">写一句话，AI 帮你拆成阶段</div>
      <div class="card"><input id="title" placeholder="比如：练吉他 / 减脂 / 每天读书">
        <div class="row"><button class="primary" onclick="preview()">生成计划</button></div></div>
      <div id="pv"></div>`;
  }
}

/* ================= 操作 ================= */
function go(h) { location.hash = h; }
function logout() { if (confirm('清除这台设备上的配置？')) { localStorage.removeItem(LS); CFG = {}; render(); } }

function bump(g, up) {
  if (!g) return;
  if (up) {
    g.streak = (g.streak || 0) + 1;
    g.stage_streak = (g.stage_streak || 0) + 1;
    g.miss = 0;
    if (g.stage_streak >= 5 && g.stage < g.stages.length - 1) { g.stage += 1; g.stage_streak = 0; }
    if (g.streak % 7 === 0) g.level = Math.min(3, (g.level || 2) + 1);
  } else {
    g.streak = Math.max(0, (g.streak || 0) - 1);
    g.stage_streak = Math.max(0, (g.stage_streak || 0) - 1);
  }
}

async function act(id, what) {
  const d = todayStr(); D.log = D.log || {}; D.log[d] = D.log[d] || {};
  const g = D.goals.find(x => x.id === id);
  const wasDone = D.log[d][id] === 'done';
  if (what === 'done') {
    if (!wasDone) bump(g, true);
    D.log[d][id] = 'done';
  } else if (what === 'later') {
    D.log[d][id] = 'later';
  } else if (what === 'undo') {
    if (wasDone) bump(g, false);
    delete D.log[d][id];
  }
  await saveData(); await loadData(); render();
}

function weekKey() {
  const d = new Date(); const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + String(week).padStart(2, '0');
}

function weekStats() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toLocaleDateString('sv-SE');
    const wd = '日一二三四五六'[d.getDay()];
    const rec = (D.log || {})[k] || {};
    days.push({ date: k, weekday: '周' + wd,
                goals: D.goals.filter(g => !g.paused).filter(g => rec[g.id] === 'done').map(g => g.title),
                water: (D.fixed.water.date === k ? D.fixed.water.ml : 0) });
  }
  return days;
}

async function genReview(again) {
  const el = document.getElementById('rv-err');
  el.textContent = 'AI 正在读你的记录…';
  const days = weekStats();
  const lines = days.map(d =>
    `${d.date} ${d.weekday}：完成 ${d.goals.length ? d.goals.join('、') : '无'}；喝水 ${d.water} ml`).join('\n');
  const goals = D.goals.filter(g => !g.paused).map(g => g.title).join('、');
  const prompt = `这是用户过去 7 天的记录：\n${lines}\n\n在做的目标：${goals}\n\n` +
    `请写一段复盘，要求：\n` +
    `1. 不超过 180 字，直接说事实，不要鼓励、不要"你真棒"\n` +
    `2. 指出一个具体模式（比如总在周几断、哪个目标掉队最厉害）\n` +
    `3. 给一条下周能立刻执行的调整建议\n` +
    `4. 如果这周几乎没做，就直说，不要美化\n` +
    `只输出 JSON：{"review":"..."}`;
  try {
    const out = await ai('你是一个不灌鸡汤、只说事实的教练。', prompt);
    const text = (out.review || '').trim();
    if (!text) throw new Error('AI 没返回内容');
    D.reviews = (D.reviews || []).filter(r => r.week !== weekKey());
    D.reviews.push({ week: weekKey(), date: todayStr(), text });
    await saveData(); await loadData(); render();
  } catch (e) {
    el.textContent = '生成失败：' + e.message;
  }
}

async function preview() {
  const t = (document.getElementById('title').value || '').trim(); if (!t) return;
  document.getElementById('pv').innerHTML = '<div class="card"><div class="meta">AI 正在拆解…</div></div>';
  try {
    const p = await ai(SYS_PLAN, '目标：' + t);
    window._pv = p;
    document.getElementById('pv').innerHTML = `<div class="card">
      <div class="meta">${esc(p.why)}</div>
      ${p.stages.map(s => `<div class="stage"><span>${esc(s.period)} · ${esc(s.focus)}</span></div>
        <div class="meta" style="padding:0 0 10px">每天：${esc(s.daily)}<br>最小：${esc(s.tiny)}</div>`).join('')}
      <div class="row"><button class="primary" onclick="create('${esc(t)}')">就用这个</button></div></div>`;
  } catch (e) {
    document.getElementById('pv').innerHTML = `<div class="card"><div class="meta" style="color:#f0a84a">生成失败：${esc(e.message)}</div></div>`;
  }
}

async function create(title) {
  const p = window._pv; if (!p) return;
  const id = Math.max(0, ...D.goals.map(g => g.id)) + 1;
  D.goals.push({ id, title, type: 'skill', why: p.why, stages: p.stages,
                 stage: 0, streak: 0, stage_streak: 0, miss: 0, level: 2, chat: [],
                 check: inferCheck(title) });
  await saveData(); await loadData(); go('today'); render();
}

async function setPrompt(id) {
  const g = D.goals.find(x => x.id === id); if (!g) return;
  const t = (document.getElementById('pm-' + id).value || '').trim();
  g.check = Object.assign({}, checkOf(g), { type: 'photo', prompt: t });
  await saveData(); await loadData(); render();
}

async function setMinutes(id, m) {
  const g = D.goals.find(x => x.id === id); if (!g) return;
  if (m === 0) {
    const v = parseInt(prompt('几分钟？', String(checkOf(g).minutes || 15)), 10);
    if (!v || v < 1 || v > 300) return;
    m = v;
  }
  g.check = Object.assign({}, checkOf(g), { type: 'timer', minutes: m });
  await saveData(); await loadData(); render();
}

async function setTarget(id, n) {
  const g = D.goals.find(x => x.id === id); if (!g) return;
  g.check = Object.assign({}, checkOf(g), { type: 'count', target: n });
  await saveData(); await loadData(); render();
}

async function setCheck(id, type) {
  const g = D.goals.find(x => x.id === id); if (!g) return;
  const base = inferCheck(g.title);
  g.check = { type };
  if (type === 'timer') g.check.minutes = base.minutes || 15;
  if (type === 'count') g.check.target = base.target || 8;
  await saveData(); await loadData(); render();
}

async function togglePause(id) {
  const g = D.goals.find(x => x.id === id); if (!g) return;
  if (!g.paused) {
    if (!confirm('暂停「' + g.title + '」？暂停期间不再出现在今天，也不会推送。')) return;
    g.paused = true;
  } else {
    g.paused = false;
  }
  await saveData(); await loadData(); render();
}

async function delGoal(id) {
  const g = D.goals.find(x => x.id === id);
  if (!g) return;
  if (!confirm('删除「' + g.title + '」？打卡记录也会一起清掉。')) return;
  D.goals = D.goals.filter(x => x.id !== id);
  Object.keys(D.log || {}).forEach(d => { if (D.log[d]) delete D.log[d][id]; });
  await saveData(); await loadData(); go('goals'); render();
}

async function quick(id, q) { document.getElementById('chatmsg').value = q; sendChat(id); }

async function sendChat(id) {
  const el = document.getElementById('chatmsg'); const t = (el && el.value || '').trim();
  if (!t) return;
  const g = D.goals.find(x => x.id === id); if (!g) return;
  el.value = ''; el.placeholder = '教练正在想…';
  const ctx = JSON.stringify({ 目标: g.title, 为什么: g.why, 阶段: g.stages[g.stage||0],
    连续做到: g.streak||0, 连续没做: g.miss||0 });
  try {
    const out = await ai(SYS_CHAT, '当前状态：' + ctx + '\n用户说：' + t);
    g.chat = g.chat || [];
    g.chat.push({ role: 'user', text: t });
    if (out.reply) g.chat.push({ role: 'assistant', text: out.reply });
    if (out.update_plan && out.update_plan.stages && out.update_plan.stages.length >= 2) {
      g.why = out.update_plan.why || g.why;
      g.stages = out.update_plan.stages;
      g.stage = Math.min(g.stage || 0, g.stages.length - 1);
      g.stage_streak = 0;
    }
    await saveData(); await loadData(); render();
  } catch (e) {
    el.placeholder = '出错了：' + e.message; el.value = t;
  }
}

window.addEventListener('hashchange', () => { TAB = (location.hash || '#today').slice(1); render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
loadData().then(render).catch(() => { if (!CFG.gist) render(); });
</script>
